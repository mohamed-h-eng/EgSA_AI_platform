<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- EgSA mark, simplified for tab size: tilted orbit, red swoosh, satellite in the orbit's gap.
       No lettering (unreadable at 16px). Ink flips to light on dark browser chrome. -->
  <style>
    .ink { stroke: #1d1d1f; }
    .ink-fill { fill: #1d1d1f; }
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #f5f5f7; }
      .ink-fill { fill: #f5f5f7; }
    }
  </style>
  <g transform="rotate(-28 32 32)">
    <!-- red swoosh hugging the lower-left inside of the orbit -->
    <path d="M9.0 28.5 L8.1 29.2 L7.5 29.9 L7.0 30.6 L6.7 31.3 L6.6 32.0 L6.7 32.7 L7.0 33.4 L7.5 34.1 L8.1 34.8 L9.0 35.5 L10.0 36.1 L11.2 36.7 L12.5 37.3 L14.0 37.8 L15.7 38.3 L17.4 38.7 L19.3 39.1 L21.3 39.4 L23.3 39.7 L25.4 39.9 L27.6 40.1 L29.8 40.2 L27.7 39.4 L25.9 38.7 L24.2 37.9 L22.6 37.2 L21.3 36.5 L20.0 35.9 L18.9 35.3 L17.9 34.8 L16.9 34.4 L16.0 34.1 L15.2 33.8 L14.3 33.5 L13.5 33.3 L12.7 33.0 L11.9 32.8 L11.2 32.4 L10.5 32.0 L9.9 31.5 L9.4 30.9 L9.1 30.2 L8.9 29.4 Z" fill="#e3000f"/>
    <!-- orbit (rx 28, ry 10), open on the right from -25° to 15° for the satellite -->
    <path class="ink" d="M59.05 34.59 A28 10 0 1 1 57.38 27.77" fill="none" stroke-width="3.4" stroke-linecap="round"/>
  </g>
  <!-- satellite in the gap: body, two solar panels, dish arm -->
  <g transform="translate(54.5 19) rotate(14)">
    <rect class="ink-fill" x="-2.6" y="-2" width="5.2" height="4" rx="0.6"/>
    <rect class="ink" x="-1.6" y="-10" width="3.2" height="6.6" fill="none" stroke-width="1.4"/>
    <rect class="ink" x="-1.6" y="3.4" width="3.2" height="6.6" fill="none" stroke-width="1.4"/>
    <path class="ink" d="M-2.6 0 H-5" fill="none" stroke-width="1.4" stroke-linecap="round"/>
  </g>
</svg>
